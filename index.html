<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>放置駐車対応フローチャート</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    /* 3カラムレイアウト（PC用） */
    .app-container {
      display: flex;
      gap: 15px;
      width: 100%;
      max-width: 1350px;
    }

    /* 左側：目次エリア */
    .sidebar-left {
      width: 200px;
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      flex-shrink: 0;
    }

    .sidebar-title {
      font-size: 1.0rem;
      font-weight: bold;
      color: #2c3e50;
      margin-top: 0;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid #007bff;
    }

    .toc-list {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 80vh;
      overflow-y: auto;
    }

    .toc-item {
      padding: 8px 10px;
      margin-bottom: 4px;
      font-size: 1.0rem;
      border-radius: 6px;
      cursor: pointer;
      color: #555;
      transition: all 0.2s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toc-item:hover {
      background-color: #e9ecef;
      color: #007bff;
    }

    .toc-item.active {
      background-color: #007bff;
      color: white;
      font-weight: bold;
    }

    /* 中央：メインコンテンツ */
    .main-content {
      flex-grow: 1;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      margin-top: 40px;
    }

    .main-title {
      font-size: 1.9rem;
      color: #2c3e50;
      margin-top: 0;
      margin-bottom: 20px;
      border-bottom: 2px solid #007bff;
      padding-bottom: 8px;
      text-align: center;
    }

    /* 質問文の文字サイズ */
    .text-box {
      font-size: 2.0rem;
      line-height: 1.4;
      font-weight: bold;
      color: #333;
      margin-bottom: 30px;
      min-height: 4em;
      text-align: left;
      background: #f8f9fa;
      padding: 25px;
      border-radius: 8px;
      border-left: 5px solid #007bff;
      white-space: pre-wrap;
    }

    .btn-container {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* 選択肢ボタン */
    button {
      font-size: 1.35rem;
      padding: 30px 55px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-option { background-color: #007bff; color: white; }
    .btn-option:hover { background-color: #0056b3; }

    .btn-next { background-color: #17a2b8; color: white; }
    .btn-next:hover { background-color: #138496; }

    .nav-container {
      margin-top: 35px;
      padding-top: 20px;
      border-top: 1px solid #eee;
      display: flex;
      justify-content: space-between;
    }

    /* 「1つ前に戻る」「最初に戻る」の文字サイズ (2.25rem) */
    .nav-container button {
      font-size: 1.5rem;
      padding: 20px 35px;
    }

    .btn-back { background-color: #ffc107; color: #212529; }
    .btn-back:hover:not(:disabled) { background-color: #e0a800; }
   
    .btn-reset { background-color: #28a745; color: white; }
    .btn-reset:hover { background-color: #1e7e34; }

    /* 右側：画像選択式プレビューエリア */
    .sidebar-right {
      width: 350px;
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      flex-shrink: 0;
      text-align: center;
    }

    /* 「参考書類サンプル」の文字 (1.9rem) */
    .sidebar-right .sidebar-title {
      font-size: 1.9rem;
      font-weight: bold;
      color: #2c3e50;
      margin-top: 0;
      margin-bottom: 15px;
      padding-bottom: 8px;
      border-bottom: 2px solid #007bff;
    }

    .img-tab-container {
      display: flex;
      gap: 5px;
      margin-bottom: 15px;
    }

    /* 「①ステッカー」「②青切符」「③納付書」の文字 */
    .img-tab {
      flex: 1;
      padding: 12px 6px;
      font-size: 1.0rem;
      font-weight: bold;
      background-color: #e9ecef;
      color: #495057;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .img-tab.active-tab {
      background-color: #007bff;
      color: white;
      font-weight: bold;
    }

    .preview-image {
      width: 100%;
      height: auto;
      max-height: 75vh;
      object-fit: contain;
      border: 1px solid #ddd;
      border-radius: 6px;
    }

    /* ==========================================================
       スマートフォン表示時（画面幅1100px以下）のレイアウト・順番調整
       ========================================================== */
    @media (max-width: 1100px) {
      .app-container {
        flex-direction: column;
      }
     
      /* 1番上にしたい：質問（メインコンテンツ） */
      .main-content {
        width: 100%;
        box-sizing: border-box;
        order: 1;
        margin-top: 0;
      }

      /* 2番目にしたい：サンプル画像 */
      .sidebar-right {
        width: 100%;
        box-sizing: border-box;
        order: 2;
      }

      /* 3番目（一番下）にしたい：目次 */
      .sidebar-left {
        width: 100%;
        box-sizing: border-box;
        order: 3;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- 左：目次 -->
    <div class="sidebar-left">
      <div class="sidebar-title">設問一覧（目次）</div>
      <ul id="tocList" class="toc-list"></ul>
    </div>

    <!-- 中央：メイン画面 -->
    <div class="main-content">
      <h1 class="main-title">放置駐車 対応フローチャート</h1>

      <div id="displayText" class="text-box">読み込み中...</div>
      <div id="actionButtons" class="btn-container"></div>

      <div class="nav-container">
        <button id="backBtn" class="btn-back" onclick="goBack()">1つ前に戻る</button>
        <button class="btn-reset" onclick="startFlow()">最初に戻る</button>
      </div>
    </div>

    <!-- 右：参考書類 選択式タブプレビュー -->
    <div class="sidebar-right">
      <div class="sidebar-title">参考書類サンプル</div>
     
      <!-- 画像切替タブ -->
      <div class="img-tab-container">
        <div id="tab-sticker" class="img-tab active-tab" onclick="switchImage('sticker.jpg', 'tab-sticker')">① ステッカー</div>
        <div id="tab-blue" class="img-tab" onclick="switchImage('blue_ticket.jpg', 'tab-blue')">② 青切符</div>
        <div id="tab-nofu" class="img-tab" onclick="switchImage('nofusho.jpg', 'tab-nofu')">③ 納付書</div>
      </div>

      <!-- 表示用画像 -->
      <img id="documentPreview" class="preview-image" src="sticker.jpg" alt="書類サンプル">
    </div>

  </div>

  <script>
    const flowData = {
      Q1: {
        title: "Q1. 警察への出頭確認",
        text: "Q1 警察への出頭は済んでいますか？",
        options: [
          { label: "はい", next: "Q2" },
          { label: "いいえ", next: "Q6" }
        ]
      },
      Q2: {
        title: "Q2. 車両返却までの支払い可否",
        text: "Q2 返却までに納付書による支払いを済ませていただくようご案内してください。(支払いは平日のみ、郵便局/銀行、貼り付けより8日以内です",
        options: [
          { label: "支払い可能", next: "Q3" },
          { label: "土日祝のため支払い不可", next: "Q7" }
        ]
      },
      Q3: {
        title: "Q3. 領収書コピー提示",
        text: "Q3 車両返却時、青切符と反則金を納付した領収書のコピーをいただく旨お伝えください。",
        options: [
          { label: "終了＿社内処理へ移る", next: "Q4" },
          { label: "コピー不可＿紛失など", next: "Q8" }
        ]
      },
      Q4: {
        title: "Q4. オペメモ入力",
        text: "Q4 オペメモ欄へ「ﾁｭｳｷﾝ_ﾘｮｳｼｭｳｼｮｺﾋﾟｰ ｱﾝﾅｲｽﾞﾐ」など誰が見てもわかる内容を意識して入力",
        options: [
          { label: "帰着処理・社内処理へ移る", next: "Q5" }
        ]
      },
      Q5: {
        title: "Q5. 青切符＆領収書コピー",
        text: "Q5 青切符と反則金を納付した際の領収書のコピーをとり原本はお客様へお返ししてください。お客様対応終了。\n\n社内処理：青切符と領収書のコピーと報告書を記入後、担当部署へ報告し終了",
        options: []
      },
      Q6: {
        title: "Q6. 警察署への出頭確認",
        text: "Q6 ステッカー記載の警察署(交通課)へ出頭して、青切符と納付書の交付を受けるようご案内してください",
        options: [
          { label: "出頭可能", next: "Q2" },
          { label: "出頭不可・拒否", next: "Q9" }
        ]
      },
      Q7: {
        title: "Q7. 代行納付の利用確認",
        text: "Q7 お客様より納付書と違反金をお預かりし、NR による代行納付の利用も可能です。利用するか確認してください",
        options: [
          { label: "利用する", next: "Q10" },
          { label: "利用しない・できない", next: "Q8" }
        ]
      },
      Q8: {
        title: "Q8. 支払い未確認時の預り金案内",
        text: "Q8 ご返却までに反則金の支払い確認が取れない場合は、車両返却時に青切符のコピーとお預かり金 25,000 円を預からせていただく旨ご案内してください。後日お客様が反則金の納付を期限内に済ませ領収書等をNRにご提示いただき(FAX/郵送等)確認が取れ次第、速やかに返金処理へ移ります",
        options: [
          { label: "預り金_了承", next: "Q11" },
          { label: "預り金_不可", next: "Q12" }
        ]
      },
      Q9: {
        title: "Q9. 未出頭時の預り金案内",
        text: "Q9 車両返却までに警察署への出頭ができない場合は、お預かり金として 25,000 円を預からせていただく旨ご案内をしてください。後日お客様が反則金の納付を期限内に済ませ領収書等をNRにご提示いただき(FAX/郵送等)確認が取れ次第、速やかに返金処理へ移ります",
        options: [
          { label: "預り金_了承", next: "Q11" },
          { label: "預り金_不可", next: "Q12" }
        ]
      },
      Q10: {
        title: "Q10. 代行納付の手続き",
        text: "Q10 納付書へお客様の氏名・住所等記入していただいてください。青切符と合わせてコピーをとります。青切符の原本はお客様へお返ししてください。反則金の額面金額をお預かりします。後日 NR 側で代行納付が完了次第お客様のご住所へ領収書を送付する旨伝えてください。対応終了。",
        options: [
          { label: "社内処理へ進む", next: "Q13" }
        ]
      },
      Q11: {
        title: "Q11. 預り金了承時の処理",
        text: "Q11 お預かり金 25,000 円とお預かり書類を記入しコピーをとる。控えとしてお客様へ原本を渡してください。後日お客様が反則金の納付を期限内に済ませ領収書等をNRにご提示いただき(FAX/郵送等)確認が取れ次第、速やかに返金処理へ移ります",
        options: [
          { label: "社内処理へ進む", next: "Q14" }
        ]
      },
      Q12: {
        title: "Q12. 預り金不可時の念書作成",
        text: "Q12 返却までに警察への出頭及び預り金の支払いが不可能な場合は、念書を記入しコピーをお客様へ渡してください。後日お客様が反則金の納付を期限内に済ませ領収書等をNRにご提示いただき(FAX/郵送等)確認が取れ次第、速やかに返金処理へ移ります",
        options: [
          { label: "社内処理へ進む", next: "Q15" }
        ]
      },
      Q13: {
        title: "Q13. 代行納付完了後の処理",
        text: "Q13 代行納付完了後は領収書のコピーをとり、原本はお客様へ郵送。コピーを担当部署へ報告して終了。",
        options: []
      },
      Q14: {
        title: "Q14. 返金処理連携",
        text: "Q14 支払い確認が取れ次第、担当部署と連携し速やかに返金処理へ移ってください。必要であれば担当部署へ振込処理を引き継いだ旨お客様へお伝えし、一週間経過しても入金にならなければご連絡をいただくよう伝えてください",
        options: []
      },
      Q15: {
        title: "Q15. 未払い対応指示",
        text: "Q15 支払期日までに支払いがない場合は担当部署と連携し確認の連絡など適宜対応してください。",
        options: []
      }
    };

    let currentId = 'Q1';
    let history = [];

    function createToc() {
      const tocList = document.getElementById('tocList');
      tocList.innerHTML = '';

      Object.keys(flowData).forEach(key => {
        const li = document.createElement('li');
        li.className = 'toc-item';
        li.id = 'toc-' + key;
        li.innerText = flowData[key].title || key;
        li.onclick = () => jumpTo(key);
        tocList.appendChild(li);
      });
    }

    function updateDisplay() {
      const current = flowData[currentId];
      document.getElementById('displayText').innerText = current.text;

      const actionButtons = document.getElementById('actionButtons');
      actionButtons.innerHTML = '';

      if (current.options && current.options.length > 0) {
        current.options.forEach(opt => {
          const btn = document.createElement('button');
          btn.innerText = opt.label;
          btn.className = (current.options.length === 1) ? 'btn-next' : 'btn-option';
          btn.onclick = () => choose(opt.next);
          actionButtons.appendChild(btn);
        });
      } else {
        const completeMsg = document.createElement('div');
        completeMsg.style.color = '#28a745';
        completeMsg.style.fontWeight = 'bold';
        completeMsg.style.fontSize = '1.8rem';
        completeMsg.innerText = '【このルートの対応フローは以上です】';
        actionButtons.appendChild(completeMsg);
      }

      document.getElementById('backBtn').disabled = (history.length === 0);

      document.querySelectorAll('.toc-item').forEach(el => el.classList.remove('active'));
      const activeToc = document.getElementById('toc-' + currentId);
      if (activeToc) {
        activeToc.classList.add('active');
        activeToc.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    }

    function choose(nextId) {
      history.push(currentId);
      currentId = nextId;
      updateDisplay();
    }

    function jumpTo(targetId) {
      if (currentId !== targetId) {
        history.push(currentId);
        currentId = targetId;
        updateDisplay();
      }
    }

    function goBack() {
      if (history.length > 0) {
        currentId = history.pop();
        updateDisplay();
      }
    }

    function startFlow() {
      currentId = 'Q1';
      history = [];
      updateDisplay();
    }

    // 画像切り替え処理
    function switchImage(fileName, tabId) {
      document.getElementById('documentPreview').src = fileName;
      document.querySelectorAll('.img-tab').forEach(tab => tab.classList.remove('active-tab'));
      document.getElementById(tabId).classList.add('active-tab');
    }

    createToc();
    startFlow();
  </script>

</body>
</html>
